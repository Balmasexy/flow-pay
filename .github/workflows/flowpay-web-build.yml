name: FlowPay Web Build

on:
  pull_request:
    branches:
      - feat/api-foundation
      - feat/card-history-repair
      - feat/flutterwave-ngn-deposits
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/flowpay-web-build.yml"
  push:
    branches:
      - feat/card-history-repair
      - feat/financial-dashboard-profile-cards
      - feat/flutterwave-ngn-deposits
      - feat/flowpay-banking-admin-tiers
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/flowpay-web-build.yml"

permissions:
  contents: read

jobs:
  web-build:
    name: Typecheck and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix apps/web
      - name: Typecheck and build web app
        run: npm run build --prefix apps/web
      - name: Install API dependencies
        run: npm install --prefix apps/api
      - name: Typecheck API
        run: npm run typecheck --prefix apps/api
