name: FlowPay security branch lockfile sync

on:
  push:
    branches:
      - feat/flowpay-passkeys-face-verification
    paths:
      - "apps/api/package.json"
      - "apps/web/package.json"
      - "apps/api/package-lock.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/flowpay-lockfile-sync.yml"

permissions:
  contents: write

concurrency:
  group: flowpay-lockfile-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate API lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix apps/api

      - name: Regenerate web lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix apps/web

      - name: Commit synchronized lockfiles
        run: |
          if git diff --quiet -- apps/api/package-lock.json apps/web/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json apps/web/package-lock.json
          git commit -m "chore: synchronize passkey dependency lockfiles"
          git push origin HEAD:${{ github.ref_name }}
